<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniCGPA - Universal CGPA Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dc2626">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#dc2626;min-height:100vh;padding-bottom:20px}
header{background:#ffeb3b;border-bottom:4px solid #000;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;color:#000}.logo span{color:#dc2626}
.container{max-width:900px;margin:20px auto;padding:0 14px;display:grid;gap:16px}
@media(min-width:768px){.container{grid-template-columns:360px 1fr}}
.card{border:3px solid #000;border-radius:24px;padding:18px;box-shadow:6px 6px 0 #000}
.card1{background:#ffffff}
.card2{background:#a5f3fc}
.card3{background:#fef08a}
.card4{background:#ffffff}
.h{font-weight:900;font-size:15px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.h1{color:#dc2626}.h2{color:#000}.h3{color:#7c3aed}
input,select{width:100%;padding:14px;border:3px solid #000;border-radius:14px;background:#fff;margin-bottom:10px;font-weight:700;outline:none}
.btn{width:100%;padding:14px;border:3px solid #000;border-radius:14px;font-weight:900;cursor:pointer;box-shadow:4px 4px 0 #000;transition:.1s}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn-add{background:#22c55e;color:#000}
.btn-pdf{background:#3b82f6;color:#fff}
.btn-clear{background:#f97316;color:#fff}
.badge{padding:6px 14px;border-radius:20px;font-weight:900;border:2px solid #000;font-size:12px}
.badge-red{background:#ef4444;color:#fff}
.badge-blue{background:#3b82f6;color:#fff}
.resultBig{background:#fff;border:3px solid #000;border-radius:20px;padding:20px;text-align:center;box-shadow:5px 5px 0 #000}
.gpaNum{font-size:52px;font-weight:900;color:#dc2626}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px;border-radius:14px;border:3px solid #000;font-weight:800;text-align:center}
.stat1{background:#22c55e;color:#000}.stat2{background:#a855f7;color:#fff}
table{width:100%;margin-top:10px;font-weight:700}
th{color:#000;text-align:left;padding:8px;border-bottom:3px solid #000}
td{padding:10px 8px;border-bottom:2px solid #eee}
.del{background:#ef4444;color:#fff;border:2px solid #000;border-radius:8px;padding:4px 10px;font-weight:900;cursor:pointer}
.footer{text-align:center;padding:20px;color:#fff;font-weight:800}
</style>
</head>
<body>
<header>
<div class="logo">🎓 Uni<span>CGPA</span></div>
<div style="background:#000;color:#ffeb3b;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900">7 COLORS 🌈</div>
</header>

<div class="container">
<div>
<div class="card card1">
<div class="h h1">📘 ADD COURSE</div>
<input id="cName" placeholder="Course Code e.g. MTH 101">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<input id="cUnit" type="number" placeholder="Unit 1-6">
<select id="cGrade">
<option value="5">A - 5.0 💚</option>
<option value="4">B - 4.0 💙</option>
<option value="3">C - 3.0 💛</option>
<option value="2">D - 2.0 🧡</option>
<option value="1">E - 1.0 🤎</option>
<option value="0">F - 0.0 ❤️</option>
</select>
</div>
<button class="btn btn-add" onclick="add()">+ Add Course 🚀</button>
<select id="semSel" onchange="switchSem()" style="margin-top:10px;background:#fef08a">
<option value="Y1S1">Year 1 - Sem 1</option>
<option value="Y1S2">Year 1 - Sem 2</option>
<option value="Y2S1">Year 2 - Sem 1</option>
<option value="Y2S2">Year 2 - Sem 2</option>
<option value="Y3S1">Year 3 - Sem 1</option>
<option value="Y3S2">Year 3 - Sem 2</option>
<option value="Y4S1">Year 4 - Sem 1</option>
<option value="Y4S2">Year 4 - Sem 2</option>
</select>
</div>

<div class="card card2" style="margin-top:16px">
<div class="resultBig">
<div style="font-weight:900;color:#000;letter-spacing:2px">⭐ CURRENT CGPA ⭐</div>
<div class="gpaNum" id="cgpa">0.00</div>
<div id="class" class="badge badge-red">Add courses</div>
<div class="stats">
<div class="stat stat1"><small>Total Units</small><div style="font-size:22px" id="tUnits">0</div></div>
<div class="stat stat2"><small>Total Points</small><div style="font-size:22px" id="tPoints">0</div></div>
</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
<button class="btn btn-pdf" onclick="window.print()">📄 PDF</button>
<button class="btn btn-clear" onclick="clearAll()">🗑️ Clear</button>
</div>
</div>
</div>

<div class="card card4">
<div style="display:flex;justify-content:space-between">
<div class="h h3" id="semTitle">Year 1 - Sem 1 Courses</div>
<div class="badge badge-blue" id="gpaBadge">GPA 0.00</div>
</div>
<table id="table"><tr><th>Course</th><th>Unit</th><th>Grade</th><th>Pts</th><th></th></tr></table>
<div id="empty" style="text-align:center;padding:40px;color:#999;font-weight:800">📚 No courses yet<br><small>Add from left</small></div>
</div>
</div>

<div class="footer">Built with 🌈 by Okoli Success Onyedika • Red + 7 Colors Mix 🔴🟡🟢🔵🟣🟠</div>

<script>
let data=JSON.parse(localStorage.getItem('unicgpa_v2')||'{}'),currentSem=localStorage.getItem('unicgpa_curr')||'Y1S1'
const semNames={Y1S1:"Year 1 - Sem 1",Y1S2:"Year 1 - Sem 2",Y2S1:"Year 2 - Sem 1",Y2S2:"Year 2 - Sem 2",Y3S1:"Year 3 - Sem 1",Y3S2:"Year 3 - Sem 2",Y4S1:"Year 4 - Sem 1",Y4S2:"Year 4 - Sem 2"}
if(!data[currentSem])data[currentSem]=[]
document.getElementById('semSel').value=currentSem
function save(){localStorage.setItem('unicgpa_v2',JSON.stringify(data));localStorage.setItem('unicgpa_curr',currentSem)}
function switchSem(){currentSem=document.getElementById('semSel').value;if(!data[currentSem])data[currentSem]=[];save();render()}
function add(){let n=document.getElementById('cName').value.trim()||'Course '+(data[currentSem].length+1),u=parseInt(document.getElementById('cUnit').value),g=parseInt(document.getElementById('cGrade').value);if(!u){alert('Enter Unit');return}data[currentSem].push({name:n,unit:u,grade:g});document.getElementById('cName').value='';document.getElementById('cUnit').value='';save();render()}
function del(i){data[currentSem].splice(i,1);save();render()}
function clearAll(){if(confirm('Clear '+semNames[currentSem]+'?')){data[currentSem]=[];save();render()}}
function render(){let t=document.getElementById('table');t.innerHTML='<tr><th>Course</th><th>Unit</th><th>Grade</th><th>Pts</th><th></th></tr>';let c=data[currentSem]||[],su=0,sp=0;c.forEach((x,i)=>{let p=x.unit*x.grade;su+=x.unit;sp+=p;t.innerHTML+=`<tr><td>${x.name}</td><td>${x.unit}</td><td>${x.grade}.0</td><td>${p}</td><td><button class=del onclick=del(${i})>X</button></td></tr>`});document.getElementById('empty').style.display=c.length?'none':'block';let g=su?(sp/su).toFixed(2):'0.00';document.getElementById('gpaBadge').innerText='GPA '+g;document.getElementById('semTitle').innerText=semNames[currentSem]+' Courses';let tu=0,tp=0;Object.values(data).forEach(l=>l.forEach(v=>{tu+=v.unit;tp+=v.unit*v.grade}));let cg=tu?(tp/tu).toFixed(2):'0.00';document.getElementById('cgpa').innerText=cg;document.getElementById('tUnits').innerText=tu;document.getElementById('tPoints').innerText=tp;let cl='';let v=parseFloat(cg);if(v>=4.5)cl='FIRST CLASS 🥇';else if(v>=3.5)cl='2:1 UPPER 🔥';else if(v>=2.4)cl='2:2 LOWER';else if(v>=1.5)cl='THIRD CLASS';else if(v>=1.0)cl='PASS';else cl='PROBATION / FAIL';document.getElementById('class').innerText=cl}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')
</script>
</body>
</html>
